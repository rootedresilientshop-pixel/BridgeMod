services:
  dreamcraft-api:
    image: dreamcraft-legacies-v2:latest
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 5g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sqlite3,urllib.request; db=os.getenv('SAGA_DB_PATH','/app/data/saga.db'); sqlite3.connect(db).execute('SELECT 1').fetchone(); r=urllib.request.urlopen('http://127.0.0.1:8002/api/health', timeout=5); assert r.status==200",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 5G
